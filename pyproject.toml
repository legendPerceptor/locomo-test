[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locomo-test-kit"
version = "0.1.0"
description = "Standardized LoCoMo benchmark test toolkit for OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "httpx[socks]>=0.27",
    "websocket-client>=1.6",
    "openai>=1.0",
]

[project.optional-dependencies]
# Only needed for the local embedding service (deploy_model.py).
# Not required to run the LoCoMo benchmark itself.
# Install with `pip install ".[embedding]"` or `uv sync --extra embedding`.
embedding = [
    "sentence-transformers>=2.2",
    "flask>=3.0",
    "numpy>=1.24",
]

[project.scripts]
locomo-test = "locomo_test.cli:main"

[tool.setuptools.packages.find]
include = ["locomo_test*"]